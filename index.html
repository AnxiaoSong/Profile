<p>2019骞?鏈堣捣鍦ㄨタ瀹夌數瀛愮鎶€澶у杩涜纭曞崥杩炶锛屽笀浠庢矆鐜夐緳鏁欐巿锛屽苟浜?026骞磋幏璁＄畻鏈虹瀛︿笌鎶€鏈笓涓氬崥澹浣嶃€傛湡闂达紝浠栦簬2024骞磋嚦2025骞磋荡濂ュ厠鍏板ぇ瀛﹁瀛︼紝鍚堜綔瀵煎笀涓篏iovanni Russello鏁欐巿銆備粬鐨勬湰绉戞瘯涓氫簬娌冲崡宸ヤ笟澶у杞欢宸ョ▼涓撲笟銆備粬灏嗕簬2026骞?鏈堝姞鍏ユ境闂ㄥ煄甯傚ぇ瀛︽媴浠绘暀鑱屻€備粬鐨勭爺绌舵柟鍚戞兜鐩栧畨鍏ㄥ鏂硅绠楋紙MPC锛夈€佽仈閭﹀涔犮€侀殣绉佷繚鎶ゆ満鍣ㄥ涔犮€佸ぇ灏忔ā鍨嬪崗鍚屽畨鍏ㄤ互鍙婂簲鐢ㄥ瘑鐮佸銆?/p>
<blockquote>

  <p>Anxiao Song is currently pursuing a Ph.D. in Computer Science and Technology at Xidian University under Prof. Yulong Shen, and was a visiting researcher at the University of Auckland (2024鈥?025) under Prof. Giovanni Russello, funded by CSC. He received his B.E. from Henan University of Technology. He will join City University of Macau as a faculty member in August 2026. His research interests include secure MPC, federated learning, privacy-preserving ML, collaborative security for small and large models, and applied cryptography.</p>
</blockquote>
